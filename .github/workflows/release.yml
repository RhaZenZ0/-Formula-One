name: Release APK

# Publishes a signed APK as a GitHub release.
# Push a tag such as v1.1.0, or run this workflow by hand and enter a version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Use your own signing key if one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.F1INFO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "F1INFO_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets."
          else
            echo "No F1INFO_KEYSTORE_BASE64 secret; signing with the shared key in keystore/."
          fi

      - name: Test and build
        env:
          F1INFO_KEYSTORE_PASSWORD: ${{ secrets.F1INFO_KEYSTORE_PASSWORD }}
          F1INFO_KEY_ALIAS: ${{ secrets.F1INFO_KEY_ALIAS }}
          F1INFO_KEY_PASSWORD: ${{ secrets.F1INFO_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew testDebugUnitTest assembleRelease -PversionName="$VERSION" -PversionCode="${BUILD_NUMBER}0"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="F1-Info-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "F1 Info $VERSION" --generate-notes
          fi
